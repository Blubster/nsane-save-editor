[workspace]
members = ["crates/igb", "crates/nsane", "crates/gui"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
igb = { path = "crates/igb" }
nsane = { path = "crates/nsane" }

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

# tests
egui_kittest = "=0.36.2"
sha2 = "0.11.0"

eframe = { version = "=0.36.2", features = ["persistence"] }
egui = "=0.36.2"
log = "0.4.27"

# native
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
env_logger = "0.11.8"
png = "0.18.1"
rfd = "0.17.2"

# web
js-sys = "0.3.70"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.70", features = [
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Event",
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "Url",
    "Window",
] }

# winit 0.30 with a Windows fix that only its 0.31 line has: see vendor/README.md.
[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The container tests parse every save hundreds of times; keep them fast in
# debug builds (overflow checks stay on).
[profile.dev.package.igb]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
