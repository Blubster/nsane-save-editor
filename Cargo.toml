[workspace]
members = ["crates/igb", "crates/nsane", "crates/gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
igb = { path = "crates/igb" }
nsane = { path = "crates/nsane" }

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

# tests
egui_kittest = "=0.36.2"
sha2 = "0.11.0"

eframe = "=0.36.2"
egui = "=0.36.2"
log = "0.4.27"

# native
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
env_logger = "0.11.8"
png = "0.18.1"
rfd = "0.17.2"

# web
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"

[workspace.lints.rust]
unsafe_code = "forbid"

# The container tests parse every save hundreds of times; keep them fast in
# debug builds (overflow checks stay on).
[profile.dev.package.igb]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
