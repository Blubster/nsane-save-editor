[package]
name = "gui"
description = "Save editor for Crash Bandicoot N. Sane Trilogy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nsane-save-editor"
path = "src/main.rs"

[dependencies]
nsane.workspace = true
eframe.workspace = true
egui.workspace = true
log.workspace = true
rfd.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono.workspace = true
env_logger.workspace = true
png.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

# The icon and version information of the Windows executable. Build
# dependencies follow the host, and Windows builds are made on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
# wgpu: the renders of `app/renders.rs`
egui_kittest = { workspace = true, features = ["wgpu"] }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
