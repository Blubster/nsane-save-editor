name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"

jobs:
  # A pull request's commit subjects follow Conventional Commits.
  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # the branch itself, not the merge GitHub prepares, with all history
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: scripts/check-commits.sh
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/check-commits.sh "$BASE"

  check:
    name: Check (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: scripts/check.sh
        run: scripts/check.sh

  build-linux:
    name: Build (Linux)
    # The binary needs the glibc of the system it is built on, or a newer one.
    # 22.04 has glibc 2.35: the binary runs on Ubuntu 22.04, Debian 12 and
    # later. ubuntu-latest would raise that floor with each new image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gui
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: target/release/nsane-save-editor
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gui
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/nsane-save-editor.exe
          if-no-files-found: error

  build-web:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"
          trunk --version
      - name: trunk build
        working-directory: crates/gui
        # GitHub Pages serves the site from /<repository>/.
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: crates/gui/dist
          if-no-files-found: error

  release:
    name: Draft a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-linux, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir out
          chmod +x artifacts/linux/nsane-save-editor
          cp LICENSE artifacts/linux/
          cp LICENSE artifacts/windows/
          tar -czf "out/nsane-save-editor-${tag}-linux-x86_64.tar.gz" -C artifacts/linux nsane-save-editor LICENSE
          (cd artifacts/windows && zip -q "../../out/nsane-save-editor-${tag}-windows-x86_64.zip" nsane-save-editor.exe LICENSE)
          (cd artifacts/web && zip -qr "../../out/nsane-save-editor-${tag}-web.zip" .)
          ls -l out
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft: it is published by hand once checked.
        run: gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --draft --generate-notes

  # Optional: publishes the web build to GitHub Pages on a release tag or a
  # manual run. Turn it on with the repository variable DEPLOY_PAGES=true,
  # after setting Settings > Pages > Source to "GitHub Actions". The
  # github-pages environment only accepts main at first: for the tags, add
  # the rule "v*" under Settings > Environments > github-pages.
  pages:
    name: Deploy to GitHub Pages
    if: vars.DEPLOY_PAGES == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [check, build-web]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
